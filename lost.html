<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>I Lost Something | The Pinboard</title>
</head>

<body>

    <header>
        <h1>The Pinboard</h1>
        <p>Campus Lost & Found</p>
    </header>

    <hr>

    <main>

        <section>

            <h2>🔍 I Lost Something</h2>

            <p>
                Fill in the details below to help others identify and return your lost item.
            </p>

            <form action="index.html">

                <div>
                    <label for="itemName">Item Name</label><br>
                    <input
                        type="text"
                        id="itemName"
                        name="itemName"
                        placeholder="e.g. Blue Water Bottle"
                        required>
                </div>

                <br>

                <div>
                    <label for="category">Category</label><br>

                    <select id="category" name="category" required>
                        <option value="">Select Category</option>
                        <option>Bags</option>
                        <option>Electronics</option>
                        <option>ID Card</option>
                        <option>Books</option>
                        <option>Keys</option>
                        <option>Clothing</option>
                        <option>Water Bottle</option>
                        <option>Wallet</option>
                        <option>Others</option>
                    </select>
                </div>

                <br>

                <div>
                    <label for="location">Last Seen Location</label><br>
                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="e.g. Classroom 305, Library"
                        required>
                </div>

                <br>

                <div>
                    <label for="date">Date Lost</label><br>
                    <input
                        type="date"
                        id="date"
                        name="date"
                        required>
                </div>

                <br>

                <div>
                    <label for="time">Approximate Time</label><br>
                    <input
                        type="time"
                        id="time"
                        name="time">
                </div>

                <br>

                <div>
                    <label for="description">Item Description</label><br>

                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                        cols="40"
                        placeholder="Mention colour, brand, size, unique features or anything that helps identify the item."
                        required></textarea>
                </div>

                <br>

                <div>
                    <label for="photo">Upload Image (Optional)</label><br>
                    <input
                        type="file"
                        id="photo"
                        name="photo"
                        accept="image/*">
                </div>

                <br>

                <div>
                    <label for="contact">Contact Number</label><br>
                    <input
                        type="tel"
                        id="contact"
                        name="contact"
                        placeholder="Enter your phone number"
                        required>
                </div>

                <br>

                <button type="submit">
                    Submit Lost Item
                </button>

                <button type="reset">
                    Clear Form
                </button>

            </form>

            <br>

            <button onclick="window.location.href='index.html'">
                ← Back to Home
            </button>

        </section>

    </main>

    <hr>

    <footer>
        <p>© 2026 The Pinboard</p>
    </footer>
    <script>
    document.querySelector("form").addEventListener("submit", async function (event) {
        event.preventDefault();

        const isFoundPage = window.location.pathname.includes("found");

        const payload = {
            title: document.getElementById("itemName").value.trim(),
            category: document.getElementById("category").value,
            type: "LOST",
            location: document.getElementById("location").value.trim(),
            item_date: document.getElementById("date").value,
            item_time: document.getElementById("time").value,
            description: document.getElementById("description").value.trim(),
            contact: document.getElementById("contact").value.trim()
        };

        try {
            const response = await fetch("/api/items", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert("Item posted successfully!");
                window.location.href = "portal.html";
            } else {
                alert("Failed to submit item.");
            }
        } catch (error) {
            console.error(error);
            alert("Server connection error.");
        }
    });
    </script>

</body>

</html>
